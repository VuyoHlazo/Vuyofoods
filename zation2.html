<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zation2 - Alcohol & Nomzamo Butchery Delivery</title>
  <style>
    body {
      background: #fff8dc;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      color: #000;
    }
    header {
      background: #000;
      color: #fff8dc;
      padding: 1rem;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
      background: #fff3b0;
      border-radius: 10px;
      border: 3px solid #000;
    }
    h2 {
      text-align: center;
      color: #000;
      margin-bottom: 1rem;
    }
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }
    .product-card {
      background: #fffacd;
      border: 2px solid #ccc;
      border-radius: 8px;
      text-align: center;
      padding: 1rem;
      margin: 1rem;
      width: 250px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .product-card:hover {
      transform: scale(1.03);
    }
    .product-card img {
      width: 100%;
      height: auto;
      max-height: 180px;
      border-radius: 5px;
      object-fit: contain;
    }
    .product-card div {
      margin-top: 0.5rem;
      font-weight: bold;
      color: #000;
    }
    button {
      background: #000;
      color: #fff8dc;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1rem;
      margin: 10px auto;
      display: block;
    }
    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #aaa;
      background: #fff;
      color: #000;
      border-radius: 5px;
      font-size: 1rem;
    }
    .notification {
      background: #90ee90;
      color: #000;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 5px;
      white-space: pre-wrap;
      font-size: 1rem;
    }
    #payWithOzow {
      background: #28a745;
      color: #fff;
      width: 100%;
    }
    @media (max-width: 768px) {
      .product-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<header>🍾 Zation2 & Nomzamo Butchery Delivery 🍖</header>

<main>
  <section id="products">
    <h2>Products</h2>
    <div class="product-grid" id="productGrid"></div>

    <div id="cartSummary" class="notification" style="display:none;"></div>
    <button id="checkoutBtn" onclick="showDelivery()" disabled>Next: Delivery Info</button>
  </section>

  <section id="delivery" style="display:none;">
    <h2>Delivery Information</h2>
    <form id="orderForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <textarea id="address" placeholder="Delivery Address (Langa etc)" required></textarea>
      <button type="button" id="payWithOzow">Pay with Ozow</button>
    </form>
  </section>

  <section id="confirmation" style="display:none;">
    <div class="notification">✅ Payment successful! Order confirmation sent via email.</div>
    <button onclick="location.reload()">New Order</button>
  </section>
</main>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("EKapt1H2FKQ_IbQYA");

// ======= Cart Logic =======
const cart = {};
const DELIVERY_FEE = 25;
const cartSummary = document.getElementById("cartSummary");
const checkoutBtn = document.getElementById("checkoutBtn");

// ======= Nomzamo Products =======
const products = [
  {name:"Braai Meat Platter", price:300, img:"images/Braaimeat.jpg"},
  {name:"Ribs", price:100, img:"images/ribs.jpg"},
  {name:"Beef", price:150, img:"images/beef.jpg"},
  {name:"Beef Fat", price:80, img:"images/beeffat.jpg"},
  {name:"Beef Liver", price:90, img:"images/beefliver.jpg"},
  {name:"Chicken Feet", price:50, img:"images/chickenfeet.jpg"},
  {name:"Chicken Wings", price:70, img:"images/chickenwings.jpg"},
  {name:"Cow Tripe", price:60, img:"images/cowtripe.jpg"},
  {name:"Pork", price:120, img:"images/pork.jpg"}
];

// ======= Render Products =======
const productGrid = document.getElementById("productGrid");
products.forEach(p=>{
  const card = document.createElement("div");
  card.className="product-card";
  card.innerHTML = `<img src="${p.img}" alt="${p.name}"><div>${p.name}<br>Starting R${p.price}</div>`;
  card.onclick = ()=>{ addToCart(p); };
  productGrid.appendChild(card);
});

// ======= Add to Cart =======
function addToCart(product){
  let input = prompt(`Enter price for ${product.name} (min R${product.price}):`, product.price);
  if(!input) return;
  let price = parseInt(input);
  if(isNaN(price) || price < product.price) return alert("Invalid price!");
  let qty = prompt(`How many ${product.name}?`, "1");
  if(!qty) return;
  qty = parseInt(qty);
  if(isNaN(qty) || qty < 1) return alert("Invalid quantity!");
  if(!cart[product.name]) cart[product.name] = { qty:0, price };
  cart[product.name].qty += qty;
  cart[product.name].price = price; // update to chosen price
  updateCartSummary();
}

// ======= Update Cart =======
function updateCartSummary(){
  let subtotal = 0;
  let lines = [];
  for(const [name,{qty,price}] of Object.entries(cart)){
    const total = qty*price;
    lines.push(`${name} x${qty} = R${total}`);
    subtotal += total;
  }
  const grandTotal = subtotal + DELIVERY_FEE;
  cartSummary.textContent = `Order:\n${lines.join("\n")}\nSubtotal: R${subtotal}\nDelivery: R${DELIVERY_FEE}\nGrand Total: R${grandTotal}`;
  cartSummary.style.display="block";
  checkoutBtn.disabled = subtotal<100;
}

// ======= Delivery Section =======
function showDelivery(){
  document.getElementById("products").style.display="none";
  document.getElementById("delivery").style.display="block";
}

// ======= Ozow Payment =======
document.getElementById("payWithOzow").addEventListener("click",function(){
  alert("🔒 Redirecting to Ozow for payment... (demo)");
  sendOrderEmail();
});

// ======= Send Email =======
function sendOrderEmail(){
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const address = document.getElementById("address").value.trim();
  const subtotal = Object.values(cart).reduce((sum,{qty,price})=>sum+qty*price,0);
  const total = subtotal + DELIVERY_FEE;
  const items = Object.entries(cart).map(([name,{qty,price}])=>`${name} x${qty} = R${qty*price}`).join("\n");

  emailjs.send("service_w2w1iqn","template_jqxt9ay",{
    name, phone, address, user_email: email, items, total: total.toString()
  }).then(()=>{
    document.getElementById("delivery").style.display="none";
    document.getElementById("confirmation").style.display="block";
  }).catch(e=>{ alert("Email failed"); console.error(e); });
}
</script>

</body>
</html>
